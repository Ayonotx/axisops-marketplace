<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — AxisOps Marketplace</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #04121c; color: #fff; font-family: system-ui, sans-serif; text-align: center; }
    .card { padding: 2rem; }
    .logo { width: 56px; height: 56px; border-radius: 14px; display: inline-grid; place-items: center;
      background: linear-gradient(135deg, #22c55e, #15803d); font-weight: 900; font-size: 24px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #94a3b8; font-size: 14px; margin: 0; }
    button { margin-top: 20px; background: #12a44c; color: #fff; border: 0; border-radius: 10px;
      padding: 12px 28px; font-weight: 700; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">A</div>
    <h1>You're offline</h1>
    <p>AxisOps Marketplace needs an internet connection.<br />Check your data or WiFi and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
